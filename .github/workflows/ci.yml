name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node.js & TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the new lockfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures git-auto-commit has proper history

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Generate Lockfile
        # 'npm install' will resolve the new Vite 8 compatible plugin 
        # and generate a fresh, cross-platform package-lock.json
        run: npm install

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true # 

      - name: Run Test Suite
        run: npm run test:ci

      - name: Build Application
        run: npm run build

      - name: Auto-commit fresh package-lock.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update package-lock.json for Vite 8 compatibility"
          file_pattern: "package-lock.json"

  backend:
    name: Backend (Python & FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Backend Tests
        run: |
          cd backend
          pytest --cov=. --cov-report=xml

      - name: Basic Syntax Check
        run: |
          cd backend
          python -m py_compile main.py
