name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # 'npm ci' is perfect here because you have a committed package-lock.json
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite
        # Uses your existing 'test:ci' script which includes coverage and --forceExit
        run: npm run test:ci

      - name: Build Application
        run: npm run build

  backend:
    name: Backend (Python & FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Safely install dev dependencies (pytest, etc.) if the file exists
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Backend Tests
        run: |
          cd backend
          pytest --cov=. --cov-report=xml

      - name: Basic Syntax Check
        # Ensures the main entry point has no glaring syntax errors before deployment
        run: |
          cd backend
          python -m py_compile main.py
