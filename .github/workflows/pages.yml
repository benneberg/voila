name: Deploy Demo → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build demo + deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build demo (client-side only)
        run: npm run build
        env:
          # Demo mode: no backend URL configured → runs 100% in-browser
          VITE_DEMO_MODE: "true"
          VITE_APP_TITLE: "Voila! — Live Demo"

      - name: Inject demo banner
        run: |
          # Add a small banner to index.html so visitors know this is the demo
          sed -i 's|</title>|</title>\n  <meta name="description" content="Voila! demo — runs 100% in your browser, no server required.">|' dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
