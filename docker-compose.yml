version: '3.8'

services:
  # Voila FastAPI Backend
  voila-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voila-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=false
      - REDIS_URL=redis://redis:6379
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://voila.app,https://www.voila.app}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: voila-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf
    # Production: TLS enabled (use docker-compose -f docker-compose.yml -f docker-compose.tls.yml up)
    command: >
      redis-server
      --appendonly yes
      --tls-port 6380
      --port 0
      --tls-cert-file /certs/redis.crt
      --tls-key-file /certs/redis.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # Redis (non-TLS) for development
  redis-dev:
    image: redis:7-alpine
    container_name: voila-redis-dev
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # Apache Tika for deep metadata extraction
  tika:
    image: apache/tika:latest-full
    container_name: voila-tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: voila-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: voila-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  default:
    name: voila-network

volumes:
  redis_data:
  prometheus_data:
  grafana_data: