# Redis Configuration for Voila
# Production-ready settings

# Network
bind 127.0.0.1 ::1
port 6379
protected-mode yes

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security
# Note: For TLS, use docker-compose.tls.yml override
# requirepass ${REDIS_PASSWORD}  # Uncomment and set via environment

# Logging
loglevel notice

# Performance
timeout 300
tcp-keepalive 300
