global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: voila
    environment: production

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager URL when configured

scrape_configs:

  # FastAPI backend metrics (via prometheus-fastapi-instrumentator)
  - job_name: voila-backend
    static_configs:
      - targets: ['app:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Redis metrics (via redis-exporter sidecar — optional)
  - job_name: redis
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
